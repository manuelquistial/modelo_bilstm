[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sun2026-lower-limb-bci"
version = "1.0.0"
description = "Reproduction of Sun et al. 2026 CNN-SE-BiLSTM for lower-limb motor imagery EEG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "mne>=1.6.0",
    "torch>=2.0.0",
    "brainflow>=5.0.0",
    "pygame>=2.5.0",
    "PyWavelets>=1.4.0",
    "joblib>=1.3.0",
    "tqdm>=4.65.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
